<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лабораторная работа № 18 — Изучение свойств изображения</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="ttl"><h1 id="labTitle"></h1><span class="badge">Комплект № 2</span></div>
  <h2 id="labName"></h2>
  <p id="labTask"></p>
  <div id="labSteps"></div>
</header>

<main>
  <nav id="labs" aria-label="Выбор лабораторной работы"><h3>Лабораторные работы</h3><div id="labList"></div></nav>
  <section class="bench">
    <svg id="scene" viewBox="0 0 1310 640" role="img" aria-label="Кейс с комплектом слева, рабочий стол и оптическая скамья справа">
      <defs>
        <linearGradient id="yel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset=".45" stop-color="#f7b500"/><stop offset="1" stop-color="#c98700"/></linearGradient>
        <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f9fa"/><stop offset=".5" stop-color="#9aa2a8"/><stop offset="1" stop-color="#dfe3e6"/></linearGradient>
        <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f7"/><stop offset=".3" stop-color="#b4bcc2"/><stop offset=".65" stop-color="#eef0f1"/><stop offset="1" stop-color="#7d868c"/></linearGradient>
        <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a86ff"/><stop offset="1" stop-color="#1448b8"/></linearGradient>
        <radialGradient id="glass" cx=".35" cy=".3"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#bfe3ff"/><stop offset="1" stop-color="#5f9cc4"/></radialGradient>
        <radialGradient id="glow"><stop offset="0" stop-color="#fff6b0" stop-opacity=".95"/><stop offset=".45" stop-color="#ffd23a" stop-opacity=".35"/><stop offset="1" stop-color="#ffd23a" stop-opacity="0"/></radialGradient>
        <pattern id="foam" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#26272a"/><circle cx="1.5" cy="1.5" r=".8" fill="#37383c"/><circle cx="4.5" cy="4.5" r=".7" fill="#18181a"/></pattern>
        <filter id="bl" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur id="gb" stdDeviation="0"/></filter>
        <clipPath id="cp"><rect width="200" height="200" rx="4"/></clipPath>
      </defs>

      <!-- кейс -->
      <rect x="8" y="14" width="384" height="276" rx="24" fill="url(#blue)" stroke="#0c2f80" stroke-width="2"/>
      <rect x="14" y="20" width="372" height="8" rx="4" fill="#fff" opacity=".25"/>
      <rect x="26" y="34" width="348" height="240" rx="10" fill="url(#foam)" stroke="#111"/>
      <g id="slots"></g>
      <text x="200" y="306" text-anchor="middle" font-size="12" fill="#9aa4b2">Комплект № 2 — доставайте предметы из кейса</text>

      <!-- рабочая область -->
      <rect x="408" y="10" width="892" height="620" rx="18" fill="#fff" opacity=".04" stroke="#fff" stroke-opacity=".08"/>
      <rect x="428" y="560" width="852" height="40" rx="4" fill="#0006" transform="translate(0 6)"/>
      <rect x="428" y="560" width="852" height="40" rx="4" fill="url(#rail)" stroke="#5d6469"/>
      <rect x="428" y="560" width="852" height="5" fill="#f0e060" opacity=".85"/>
      <rect x="422" y="556" width="12" height="48" rx="3" fill="#6f777d"/><rect x="1274" y="556" width="12" height="48" rx="3" fill="#6f777d"/>

      <!-- вид экрана -->
      <g id="insp" transform="translate(100 372)">
        <rect x="-26" y="-46" width="252" height="262" rx="16" fill="#1f2226" stroke="#fff" stroke-opacity=".08"/>
        <text x="100" y="-22" text-anchor="middle" font-size="14" font-weight="600" fill="#e4e3dc">Экран со стороны лампы</text>
        <rect width="200" height="200" rx="4" fill="#f4f3ee"/>
        <g clip-path="url(#cp)"><path id="grid" stroke="#d6d3c8"/><g id="img" transform="translate(100 100)"></g></g>
        <text id="imsg" x="100" y="106" text-anchor="middle" fill="#7a7a72" font-size="13"></text>
        <text x="100" y="212" text-anchor="middle" font-size="11" fill="#9aa4b2">клетка — 1 см</text>
      </g>
    </svg>
    <div class="bar">
      <label class="sw"><input type="checkbox" id="rays"><span></span>Показать ход лучей</label>
      <button type="button" id="reset">Убрать всё в кейс</button>
      <span id="hint">Достаньте предмет из кейса и перетащите в рабочую область. Лампу, линзу и экран ставьте на скамью.</span>
    </div>
    <p class="help">Провода: щёлкните по гнезду, затем по другому гнезду. Щёлкните по проводу, чтобы убрать его. Рычаг ключа замыкает и размыкает цепь.</p>
  </section>

  <aside>
    <form id="sheet" class="blank" onsubmit="return false">
      <h3>Бланк ответов № 2</h3>
      <div id="fields"></div>
      <button type="button" id="check">Проверить работу</button>
      <div id="res"></div>
    </form>
  </aside>
</main>

<script src="js/items.js"></script>
<script src="js/labs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
